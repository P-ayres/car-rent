<nav>
    <div class="nao-imprimir">
        <a href="{% url 'home' %}">Início</a>
        {% if user.is_superuser %}
            <a href="{% url 'cadastrar_funcionario' %}">Cadastrar funcionário</a>
            <a href="{% url 'listar_funcionarios' %}">Listar Funcionários</a>
            <a href="{% url 'funcionarios_inativos' %}">Funcionários inativos</a>
            <a href="{% url 'listar_clientes' %}">Gerenciar Clientes</a>
            <a href="{% url 'cadastrar_veiculo' %}">Cadastrar Veículo</a>
            <a href="{% url 'listar_veiculos' %}">Listar Veículos</a>
        {% endif %}
    </div>
    <div class="usuario-menu">
        {% if user.is_authenticated %}
            <span class="nao-imprimir">Olá, {{ user.username }}!</span>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="nao-imprimir" type="submit" class="link-logout">Sair</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </div>
</nav>
